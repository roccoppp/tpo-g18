services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      MONGODB_URI: mongodb://mongo:27017/tpo-g18?directConnection=true
      # bolt:// conecta directo al servidor. neo4j:// pediría una tabla de ruteo, que en un
      # servidor único anuncia localhost y no sirve desde este contenedor.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: tpo-g18-neo4j
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # Las transacciones de q14/q15 requieren un replica set, aunque tenga un solo nodo.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Inicializa el replica set una sola vez y da "healthy" cuando el nodo ya es primario.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) };
          if (!db.hello().isWritablePrimary) quit(1)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/tpo-g18-neo4j
      # Memoria acotada: el Codespace también corre MongoDB y Node.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "tpo-g18-neo4j", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  mongo-data:
  neo4j-data:
