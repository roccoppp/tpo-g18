services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      MONGODB_URI: mongodb://mongo:27017/farmared?directConnection=true
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # Las transacciones de q14/q15 requieren un replica set, aunque tenga un solo nodo.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Inicializa el replica set una sola vez y da "healthy" cuando el nodo ya es primario.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) };
          if (!db.hello().isWritablePrimary) quit(1)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
  redis-data:
